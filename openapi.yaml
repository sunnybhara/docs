      responses:
        "200":
          description: Analytics data
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSuccessResponse"
              examples:
                by_endpoint:
                  summary: Analytics grouped by endpoint
                  value:
                    success: true
                    result:
                      analytics:
                        total_requests: 1234
                        total_cost: 7.404
                        cache_hits: 500
                        cache_hit_rate: 0.41
                        avg_latency_ms: 230
                        success_rate: 0.98
                        error_count: 25
                        endpoint_distribution:
                          "/v1/classify": 800
                          "/v1/translate": 200
                          "/v1/detect": 150
                          "/v1/moderate": 84
                        provider_distribution:
                          allam: 600
                          claude: 400
                          gemini: 234
                        period:
                          from: null
                          to: null
                      by_endpoint:
                        - endpoint: "/v1/classify"
                          requests: 800
                          cost: 4.8
                          avg_latency_ms: 200
                        - endpoint: "/v1/translate"
                          requests: 200
                          cost: 1.0
                          avg_latency_ms: 350
                    errors: []
                    request_id: req_nw_ana_abc123
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
