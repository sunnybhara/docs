              examples:
                by_endpoint:
                  summary: Usage grouped by endpoint
                  value:
                    success: true
                    result:
                      usage:
                        total_requests: 1200
                        total_cost: 7.2
                        cache_hits: 280
                        cache_hit_rate: 0.23
                        period:
                          from: null
                          to: null
                      by_endpoint:
                        - endpoint: "/v1/classify"
                          requests: 800
                          cost: 4.8
                          cache_hits: 200
                        - endpoint: "/v1/translate"
                          requests: 200
                          cost: 1.0
                          cache_hits: 50
                        - endpoint: "/v1/comments/reply"
                          requests: 100
                          cost: 0.8
                          cache_hits: 0
                    errors: []
                    request_id: req_nw_usg_abc123
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /webhooks:
    post:
      operationId: createWebhook
      summary: Create webhook endpoint
      description: |
        Register a new webhook endpoint for event notifications. Maximum 10 active
        endpoints per account. The `signing_secret` is returned only once at
        creation -- store it securely for verifying webhook signatures.
      tags: [Webhooks]
      x-nawa-cost: "Free"
      x-nawa-cache: false
      x-nawa-free: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  description: HTTPS endpoint URL (must use HTTPS)
                  examples:
                    - "https://example.com/webhooks/nawa"
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - classification.completed
                      - classification.failed
                      - credits.low
                      - credits.exhausted
      responses:
        "201":
          description: Webhook endpoint created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listWebhooks
      summary: List webhook endpoints
      tags: [Webhooks]
      x-nawa-cost: "Free"
      x-nawa-cache: false
      x-nawa-free: true
      responses:
        "200":
          description: List of webhook endpoints
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteWebhook
      summary: Deactivate webhook endpoint
      tags: [Webhooks]
      x-nawa-cost: "Free"
      x-nawa-cache: false
      x-nawa-free: true
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Webhook endpoint deactivated
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        API key authentication. Format: `Bearer nawa_live_sk_xxx` (production)
        or `Bearer nawa_test_sk_xxx` (sandbox, 100 request cap).

  headers:
    X-Request-Id:
      description: Unique request identifier
      schema:
        type: string
    X-NAWA-Provider:
      description: AI provider used for this request
      schema:
        type: string
        enum: [allam, claude]
    X-NAWA-Cache:
      description: Whether the response was served from semantic cache
      schema:
        type: string
        enum: [HIT, MISS]
    X-NAWA-Latency:
      description: Processing time in milliseconds
      schema:
        type: integer
    X-NAWA-Balance:
      description: Current credit balance in USD
      schema:
        type: string
    X-RateLimit-Limit:
      description: Maximum requests allowed per minute for this tier
      schema:
        type: integer
    X-RateLimit-Remaining:
      description: Remaining requests in the current window
      schema:
        type: integer
    X-RateLimit-Reset:
      description: RFC 3339 timestamp when the rate limit window resets
      schema:
        type: string
        format: date-time

  schemas:
    # --- Success Envelopes ---

    ClassifySuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/ClassificationResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    TranslateSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/TranslateResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    DetectSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/DetectResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    ModerateSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/ModerateResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    RubricSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/RubricResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    ReplySuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/ReplyResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    FeedbackSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/FeedbackResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    CommentsListSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          type: object
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/CommentItem"
            pagination:
              $ref: "#/components/schemas/Pagination"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    AnalyticsSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/AnalyticsResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    HealthSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/HealthResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    UsageSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/UsageResult"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    WebhookSuccessResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          $ref: "#/components/schemas/WebhookEndpoint"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    WebhookListResponse:
      type: object
      required: [success, result, errors, request_id]
      properties:
        success:
          type: boolean
          const: true
        result:
          type: object
          properties:
            object:
              type: string
              const: list
            data:
              type: array
              items:
                $ref: "#/components/schemas/WebhookEndpoint"
        errors:
          type: array
          maxItems: 0
          items: {}
        request_id:
          type: string

    # --- Domain Objects ---

    ClassificationResult:
      type: object
      required: [id, object, intent, sentiment, language, dialect, dialect_confidence, requires_response, priority, suggested_reply, provider, model, fallback_used, tokens_used, cost_usd, credits_used]
      properties:
        id:
          type: string
          description: Classification ID in `cls_nw_xxx` format
          examples:
            - "cls_nw_lx4cqy2j2o1o"
        object:
          type: string
          const: classification
        intent:
          type: array
          items:
            type: string
          description: |
            One or more intent labels. Typical values: `question`, `complaint`,
            `praise`, `suggestion`, `spam`, `other`. The array may contain multiple
            labels when a comment expresses more than one intent.
          examples:
            - ["question"]
            - ["complaint", "suggestion"]
        sentiment:
          type: string
          enum: [positive, negative, neutral, mixed]
        language:
          type: string
          enum: [ar, en, mixed]
          description: Detected language of the input text
        dialect:
          type: string
          nullable: true
          enum: [gulf, egyptian, levantine, msa]
          description: |
            Currently hardcoded to `"gulf"` for any Arabic text on this endpoint;
            `null` for English. Full dialect detection runs only on `/v1/detect`
            and `/v1/translate` today. Use those endpoints when dialect
            correctness matters.
        dialect_confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: |
            Confidence score for Arabic text, `null` for English. Note: this is
            the NAGL intent classifier's internal confidence, not a
            dialect-specific score, until real dialect wiring lands.
        requires_response:
          type: boolean
          description: Whether the model judges this comment needs a reply
        priority:
          type: string
          enum: [low, medium, high]
          description: Recommended triage priority
        suggested_reply:
          type: object
          required: [text, direction]
          description: |
            NAGL's natural-language analysis note about the comment. The `text`
            field is the reasoning behind the classification, not a draft reply.
            Use `/v1/comments/reply` to generate an actual reply.
          properties:
            text:
              type: string
            direction:
              type: string
              enum: [rtl, ltr]
              description: Script direction for the text, for UI rendering
        provider:
          type: string
          enum: [claude, allam, gemini]
          description: AI provider that produced this result
        model:
          type: string
          description: Specific model ID (e.g. `claude-sonnet-4-5-20250929`)
        fallback_used:
          type: boolean
          description: True when the primary provider failed and a fallback produced this result
        tokens_used:
          type: integer
          nullable: true
          description: Currently always `null`. Token accounting is planned.
        cost_usd:
          type: number
          description: Fixed cost per call, always `0.006` for this endpoint
        credits_used:
          type: integer
          description: Fixed credit cost, always `6` for this endpoint

    TranslateResult:
      type: object
      required: [id, object, text, translated_text, source_language, target_language, tone, provider, model, fallback_used, cost_usd, credits_used, cached]
      properties:
        id:
          type: string
          description: Translation ID (trn_nw_xxx format)
        object:
          type: string
          const: translation
        text:
          type: string
          description: Original input text
        translated_text:
          type: string
          description: Translated output
        source_language:
          type: string
          enum: [ar, en]
        target_language:
          type: string
          enum: [ar, en]
        source_dialect:
          type: string
          nullable: true
          enum: [gulf, egyptian, levantine, msa]
          description: Detected dialect if source is Arabic
        target_dialect:
          type: string
          nullable: true
          enum: [gulf, egyptian, levantine, msa]
          description: Target dialect if target is Arabic
        tone:
          type: string
          enum: [formal, casual, social_media]
        provider:
          type: string
          description: "AI provider used (allam or claude)"
        model:
          type: string
        fallback_used:
          type: boolean
          description: Whether the fallback provider was used
        cached:
          type: boolean
        cost_usd:
          type: number
        credits_used:
          type: integer

    DetectResult:
      type: object
      required: [id, object, text, language, script, text_direction, word_count, fallback_used, cost_usd, credits_used, cached]
      properties:
        id:
          type: string
          description: Detection ID (det_nw_xxx format)
        object:
          type: string
          const: detection
        text:
          type: string
          description: The original input text
        language:
          type: string
          enum: [ar, en, mixed]
          description: Detected language
        dialect:
          type: string
          nullable: true
          enum: [gulf, egyptian, levantine, msa]
          description: Detected Arabic dialect. Null if not Arabic.
        dialect_confidence:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Confidence score for dialect detection. Null if not Arabic.
        script:
          type: string
          enum: [arabic, latin, mixed]
          description: Script type
        text_direction:
          type: string
          enum: [rtl, ltr]
          description: Text direction
        word_count:
          type: integer
          description: Number of words in the input text
        fallback_used:
          type: boolean
          description: Always false for this endpoint (local detection only)
        cost_usd:
          type: number
        credits_used:
          type: integer
        cached:
          type: boolean

    ModerateResult:
      type: object
      required: [id, object, text, is_safe, verdict, flags, severity, severity_score, language, categories, category_scores, flagged_terms, model, provider, fallback_used, cost_usd, credits_used, cached]
      properties:
        id:
          type: string
          description: Moderation ID (mod_nw_xxx format)
        object:
          type: string
          const: moderation
        text:
          type: string
          description: The original input text
        is_safe:
          type: boolean
          description: Whether the content passed moderation
        verdict:
          type: string
          enum: [safe, flagged]
        flags:
          type: array
          items:
            type: string
          description: List of triggered category names
        severity:
          type: string
          enum: [none, low, medium, high]
        severity_score:
          type: number
          minimum: 0
          maximum: 1
        language:
          type: string
          enum: [ar, en, mixed]
        dialect:
          type: string
          nullable: true
          enum: [gulf, egyptian, levantine, msa]
        categories:
          $ref: "#/components/schemas/ModerationCategories"
        category_scores:
          $ref: "#/components/schemas/ModerationCategoryScores"
        flagged_terms:
          type: array
          items:
            type: string
          description: Specific problematic words/phrases found
        cleaned_text:
          type: string
          nullable: true
          description: Text with flagged terms replaced by ***. Null if safe.
        model:
          type: string
        provider:
          type: string
          description: "AI provider used (allam or claude)"
        fallback_used:
          type: boolean
          description: Whether the fallback provider was used
        cost_usd:
          type: number
        credits_used:
          type: integer
        cached:
          type: boolean

    ModerationCategories:
      type: object
      properties:
        profanity:
          type: boolean
        hate_speech:
          type: boolean
        harassment:
          type: boolean
        sexual:
          type: boolean
        spam:
          type: boolean
        self_harm:
          type: boolean
        violence:
          type: boolean

    ModerationCategoryScores:
      type: object
      properties:
        profanity:
          type: number
          minimum: 0
          maximum: 1
        hate_speech:
          type: number
          minimum: 0
          maximum: 1
        harassment:
          type: number
          minimum: 0
          maximum: 1
        sexual:
          type: number
          minimum: 0
          maximum: 1
        spam:
          type: number
          minimum: 0
          maximum: 1
        self_harm:
          type: number
          minimum: 0
          maximum: 1
        violence:
          type: number
          minimum: 0
          maximum: 1

    RubricResult:
      type: object
      required: [id, object, categories, multi_label, language, provider, model, fallback_used, cost_usd, credits_used]
      properties:
        id:
          type: string
          description: Rubric classification ID in `rcl_nw_xxx` format
          examples:
            - "rcl_nw_a1b2c3d4e5f6"
        object:
          type: string
          const: rubric_classification
        categories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Category name from the rubric
              confidence:
                type: number
                minimum: 0
                maximum: 1
                description: Confidence score for this category
          description: Matched categories above the confidence threshold
        multi_label:
          type: boolean
          description: Whether multi-label mode was used
        language:
          type: string
          enum: [ar, en, mixed]
          description: Detected language of the input text
        provider:
          type: string
          enum: [claude, allam, gemini]
          description: AI provider used
        model:
          type: string
          description: Specific model ID
        fallback_used:
          type: boolean
          description: Whether a fallback provider was used
        cost_usd:
          type: number
          description: Always `0.003` for this endpoint
        credits_used:
          type: integer
          description: Always `3` for this endpoint

    ReplyResult:
      type: object
      required: [id, object, classification, reply, provider, model, cost_usd, credits_used]
      properties:
        id:
          type: string
          description: Reply ID in `rpl_nw_xxx` format
          examples:
            - "rpl_nw_a1b2c3d4e5f6"
        object:
          type: string
          const: comment_reply
        classification:
          type: object
          description: Classification results for the input comment
          properties:
            intent:
              type: array
              items:
                type: string
              description: Detected intent labels
            sentiment:
              type: string
              enum: [positive, negative, neutral, mixed]
            priority:
              type: string
              enum: [low, medium, high]
            requires_response:
              type: boolean
        reply:
          type: object
          description: Generated reply
          properties:
            text:
              type: string
              description: The generated reply text
            direction:
              type: string
              enum: [rtl, ltr]
              description: Script direction for UI rendering
            tone:
              type: string
              enum: [friendly, professional, casual, formal]
        provider:
          type: string
          description: AI provider used
        model:
          type: string
          description: Specific model ID
        cost_usd:
          type: number
          description: Always `0.008` for this endpoint
        credits_used:
          type: integer
          description: Always `8` for this endpoint

    FeedbackInput:
      type: object
      required: [classification_id, rating]
      properties:
        classification_id:
          type: string
          description: |
            The `id` from the classification being corrected, e.g.
            `cls_nw_lx4cqy2j2o1o` returned by `/v1/classify`.
          examples:
            - "cls_nw_lx4cqy2j2o1o"
        rating:
          type: string
          enum: [correct, incorrect, partial]
          description: How accurate the original classification was
        corrected_intent:
          type: array
          items:
            type: string
          description: |
            The intent labels you believe the classification should have
            returned. Free-form strings; standard labels are `question`,
            `complaint`, `praise`, `suggestion`, `spam`, `other`.
        corrected_sentiment:
          type: string
          enum: [positive, negative, neutral, mixed]
          description: What the sentiment should have been
        comment:
          type: string
          description: Optional free-text explanation of the correction

    FeedbackResult:
      type: object
      required: [id, object, classification_id, rating, acknowledged]
      properties:
        id:
          type: string
          description: Feedback record ID in `fb_nw_xxx` format
          examples:
            - "fb_nw_8k3r9vwxyz01"
        object:
          type: string
          const: feedback
        classification_id:
          type: string
          description: Echoed back from the request
        rating:
          type: string
          enum: [correct, incorrect, partial]
          description: Echoed back from the request
        acknowledged:
          type: boolean
          description: Always `true` on 200; confirms the feedback was persisted.

    CommentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Database record ID
        request_id:
          type: string
          description: Original request ID from the classify call
        text:
          type: string
        platform:
          type: string
          enum: [youtube, instagram, twitter, facebook]
        intent:
          type: string
          enum: [question, complaint, praise, suggestion, spam, other]
        sentiment:
          type: string
          enum: [positive, negative, neutral, mixed]
        dialect:
          type: string
          enum: [gulf, egyptian, levantine, msa]
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching comments
        limit:
          type: integer
          description: Current page size
        offset:
          type: integer
          description: Current offset
        has_more:
          type: boolean
          description: Whether more results exist beyond the current page

    AnalyticsResult:
      type: object
      properties:
        analytics:
          type: object
          properties:
            total_requests:
              type: integer
              description: Total API requests in the period
            total_cost:
              type: number
              description: Total cost in USD
            cache_hits:
              type: integer
              description: Number of requests served from cache
            cache_hit_rate:
              type: number
              minimum: 0
              maximum: 1
              description: Ratio of cache hits to total requests
            avg_latency_ms:
              type: integer
              description: Average response latency in milliseconds
            success_rate:
              type: number
              minimum: 0
              maximum: 1
              description: Ratio of successful (2xx) responses
            error_count:
              type: integer
              description: Number of error (4xx/5xx) responses
            endpoint_distribution:
              type: object
              additionalProperties:
                type: integer
              description: Request counts per endpoint
            provider_distribution:
              type: object
              additionalProperties:
                type: integer
              description: Request counts per AI provider
            period:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  nullable: true
                to:
                  type: string
                  format: date-time
                  nullable: true
        by_endpoint:
          type: array
          description: Breakdown grouped by the `group_by` query parameter. The key name changes to match the grouping (e.g. `by_day`, `by_provider`).
          items:
            type: object
            properties:
              endpoint:
                type: string
              requests:
                type: integer
              cost:
                type: number
              avg_latency_ms:
                type: integer

    HealthResult:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded]
          description: Overall API status. `healthy` when all services are healthy; `degraded` when any service is degraded or down.
        version:
          type: string
          description: API version (always `v1`)
        services:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, degraded, down]
                latency_ms:
                  type: integer
                  description: Database query latency in milliseconds
            redis:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, degraded, down]
                latency_ms:
                  type: integer
                  description: Redis ping latency in milliseconds
            nagl:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, down]
                  description: Whether the NAGL classification engine is enabled
        timestamp:
          type: string
          format: date-time
        latency_ms:
          type: integer
          description: Total health check latency in milliseconds

    UsageResult:
      type: object
      properties:
        usage:
          type: object
          properties:
            total_requests:
              type: integer
              description: Total API requests in the period
            total_cost:
              type: number
              description: Total cost in USD
            cache_hits:
              type: integer
              description: Number of requests served from cache
            cache_hit_rate:
              type: number
              minimum: 0
              maximum: 1
              description: Ratio of cache hits to total requests
            period:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  nullable: true
                to:
                  type: string
                  format: date-time
                  nullable: true
        by_endpoint:
          type: array
          description: Breakdown grouped by the `group_by` query parameter. When `group_by=day`, the key is `date` instead of `endpoint`.
          items:
            type: object
            properties:
              endpoint:
                type: string
                description: Endpoint path (when `group_by=endpoint`)
              date:
                type: string
                description: Calendar date YYYY-MM-DD (when `group_by=day`)
              requests:
                type: integer
              cost:
                type: number
              cache_hits:
                type: integer

    WebhookEndpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: webhook_endpoint
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        signing_secret:
          type: string
          description: HMAC signing secret (shown once at creation)
        active:
          type: boolean
        failure_count:
          type: integer
        created_at:
          type: string
          format: date-time

    # --- Error Envelope ---

    ErrorEnvelope:
      type: object
      required: [type, error, request_id]
      properties:
        type:
          type: string
          const: error
        error:
          type: object
          required: [type, code, message, display_message, param, doc_url, suggested_action]
          properties:
            type:
              type: string
              enum:
                - authentication_error
                - permission_error
                - rate_limit_error
                - invalid_request_error
                - not_found_error
                - api_error
            code:
              type: string
            message:
              type: string
            display_message:
              type: string
            param:
              type: string
              nullable: true
            doc_url:
              type: string
              format: uri
            suggested_action:
              type: string
        request_id:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            type: error
            error:
              type: invalid_request_error
              code: missing_field
              message: "`text` is required"
              display_message: "The required field `text` is missing."
              param: text
              doc_url: https://developers.trynawa.com/errors#missing_required_param
              suggested_action: "Include `text` in your request body."
            request_id: req_nw_a1b2c3d4e5f67890

    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            type: error
            error:
              type: authentication_error
              code: invalid_api_key
              message: API key not found
              display_message: The provided API key is not valid.
              param: Authorization
              doc_url: https://developers.trynawa.com/authentication
              suggested_action: Check your API key in the NAWA dashboard.
            request_id: req_nw_a1b2c3d4e5f67890

    PaymentRequired:
      description: Insufficient credits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            type: error
            error:
              type: permission_error
              code: insufficient_credits
              message: Credit balance is $0.00
              display_message: Your account has insufficient credits.
              param: null
              doc_url: https://developers.trynawa.com/billing
              suggested_action: Purchase credits at trynawa.com/developers/keys.
            request_id: req_nw_a1b2c3d4e5f67890

    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            type: error
            error:
              type: rate_limit_error
              code: rate_limit_exceeded
              message: "Rate limit exceeded: minute_limit"
              display_message: You have exceeded the request rate limit for your plan.
              param: null
              doc_url: https://developers.trynawa.com/rate-limits
              suggested_action: Wait and retry, or upgrade your plan for higher limits.
            request_id: req_nw_a1b2c3d4e5f67890

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
