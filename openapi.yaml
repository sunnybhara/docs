                  value:
                    status: healthy
                    version: v1
                    services:
                      database:
                        status: healthy
                        latency_ms: 12
                      redis:
                        status: healthy
                        latency_ms: 3
                      nagl:
                        status: healthy
                    timestamp: "2026-04-20T12:00:00.000Z"
                    latency_ms: 45
        "503":
          description: One or more services degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccessResponse"

  /usage:
    get:
      operationId: getUsage
      summary: Get usage statistics
